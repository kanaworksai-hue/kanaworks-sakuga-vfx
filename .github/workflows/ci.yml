name: ci
on:
  push:
    branches: ["**"]
    tags: ["v*"]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    # Validation, privacy, build and package tests. Windows runs too: console output must survive cp1252.
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install -r tools/requirements.txt pytest
      - run: python tools/sakuga.py validate
      - run: python -m pytest -q
      - name: README asset tables are up to date
        if: matrix.os == 'ubuntu-latest'
        run: |
          python tools/sakuga.py build --no-previews --no-site
          git diff --stat --exit-code -- 'README*.md' || (echo "run: python tools/sakuga.py build, then commit" && exit 1)

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install -r tools/requirements.txt
      - name: Tag matches the catalog version
        run: test "$GITHUB_REF_NAME" = "v$(python -c 'import json; print(json.load(open("catalog.json"))["version"])')"
      - run: python tools/sakuga.py build --no-previews --no-readme
      - name: GitHub release with the engine zips
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" --title "$GITHUB_REF_NAME" --generate-notes \
            dist/downloads/*.zip dist/downloads/assets/*.zip dist/downloads/SHA256SUMS.txt
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist/site

  pages:
    needs: release
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - id: deploy
        uses: actions/deploy-pages@v4
